# Pubblica il sito https://screenlove.pages.dev su Cloudflare Pages.
# Parte da solo quando cambia il sito (cartella web/) e dopo ogni release (dal workflow Release).
# Servono i secret CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID (vedi docs/CLOUDFLARE.md):
# senza, il workflow si limita a un avviso.
name: Sito

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/make-latest-json.ps1'
      - '.github/workflows/site.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: 'Release da mostrare (es. v0.2.0); vuoto = ultima'
        type: string
        required: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: screenlove-downloads
    steps:
      - name: Secret di Cloudflare
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Mancano i secret CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID: sito non pubblicato (vedi docs/CLOUDFLARE.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.cf.outputs.ok == 'true'

      - name: latest.json dall'ultima release
        if: steps.cf.outputs.ok == 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ inputs.tag }}'
          if ($tag) { ./scripts/make-latest-json.ps1 -Tag $tag } else { ./scripts/make-latest-json.ps1 }
          if (-not (Test-Path web/public/latest.json)) { throw "latest.json non creato" }

      - uses: actions/setup-node@v5
        if: steps.cf.outputs.ok == 'true'
        with:
          node-version: '22'

      - name: Progetto Pages e bucket R2
        if: steps.cf.outputs.ok == 'true'
        working-directory: web
        run: |
          npx --yes wrangler@4 pages project create screenlove --production-branch main >/dev/null 2>&1 \
            && echo "Progetto Pages creato" || echo "Progetto Pages già presente"
          if ! npx --yes wrangler@4 r2 bucket list 2>/dev/null | grep -q "$BUCKET"; then
            npx --yes wrangler@4 r2 bucket create "$BUCKET" >/dev/null 2>&1 && echo "Bucket R2 $BUCKET creato"
          fi
          if npx --yes wrangler@4 r2 bucket list 2>/dev/null | grep -q "$BUCKET"; then
            echo "Bucket R2 $BUCKET presente: download serviti da R2"
            echo "R2=true" >> "$GITHUB_ENV"
          else
            # R2 non attivo o token senza permesso R2: il sito inoltra i file delle release di GitHub
            echo "::warning::R2 non disponibile (bucket $BUCKET non trovato né creabile): i download passano dalla release su GitHub (vedi docs/CLOUDFLARE.md)."
            sed -i '/^\[\[r2_buckets\]\]/,$d' wrangler.toml
          fi

      - name: File della release su R2
        if: steps.cf.outputs.ok == 'true' && env.R2 == 'true'
        working-directory: web
        run: |
          # Carica i file dell'ultima release che mancano nel bucket (es. release precedenti all'attivazione di R2),
          # controllando l'impronta SHA-256 quando latest.json la riporta.
          existing=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$BUCKET/objects?per_page=1000" \
            | jq -r '.result[]?.key') || existing=""
          tag=$(jq -r '.tag_name' public/latest.json)
          jq -c '.assets[]' public/latest.json | while read -r asset; do
            name=$(echo "$asset" | jq -r '.name')
            sha=$(echo "$asset" | jq -r '.sha256 // empty')
            if echo "$existing" | grep -qx "$name"; then echo "$name: già su R2"; continue; fi
            curl -fsSL -o "/tmp/$name" "https://github.com/${{ github.repository }}/releases/download/$tag/$name"
            if [ -n "$sha" ] && [ "$(sha256sum "/tmp/$name" | cut -d' ' -f1)" != "$sha" ]; then
              echo "::error::$name: impronta SHA-256 diversa da latest.json"; exit 1
            fi
            case "$name" in *.zip) type=application/zip;; *) type=application/vnd.microsoft.portable-executable;; esac
            npx --yes wrangler@4 r2 object put "$BUCKET/$name" --file "/tmp/$name" --content-type "$type" --remote
            echo "$name: caricato su R2"
            rm -f "/tmp/$name"
          done

      - name: Pubblicazione su Cloudflare Pages
        if: steps.cf.outputs.ok == 'true'
        working-directory: web
        run: npx --yes wrangler@4 pages deploy --project-name screenlove --branch main --commit-dirty=true

      - name: Controllo del sito
        if: steps.cf.outputs.ok == 'true'
        run: |
          # la nuova versione può impiegare qualche secondo a raggiungere tutti i server di Cloudflare
          for i in $(seq 1 12); do
            if curl -fsS https://screenlove.pages.dev/latest.json | grep -q '"tag_name"' \
               && curl -fsSI https://screenlove.pages.dev/download/latest | grep -qi '^location'; then
              echo "Sito pubblicato: latest.json e /download/latest rispondono."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Il sito non risponde come previsto dopo 2 minuti."
          exit 1
