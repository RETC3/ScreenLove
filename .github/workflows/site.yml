# Pubblica il sito https://screenlove.pages.dev su Cloudflare Pages.
# Parte da solo quando cambia il sito (cartella web/) e dopo ogni release (dal workflow Release).
# Servono i secret CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID (vedi docs/CLOUDFLARE.md):
# senza, il workflow si limita a un avviso.
name: Sito

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/make-latest-json.ps1'
      - '.github/workflows/site.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: 'Release da mostrare (es. v0.2.0); vuoto = ultima'
        type: string
        required: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: screenlove-downloads
    steps:
      - name: Secret di Cloudflare
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Mancano i secret CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID: sito non pubblicato (vedi docs/CLOUDFLARE.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cf.outputs.ok == 'true'

      - name: latest.json dall'ultima release
        if: steps.cf.outputs.ok == 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ inputs.tag }}'
          if ($tag) { ./scripts/make-latest-json.ps1 -Tag $tag } else { ./scripts/make-latest-json.ps1 }

      - uses: actions/setup-node@v4
        if: steps.cf.outputs.ok == 'true'
        with:
          node-version: '22'

      - name: Progetto Pages e bucket R2
        if: steps.cf.outputs.ok == 'true'
        working-directory: web
        run: |
          npx --yes wrangler@4 pages project create screenlove --production-branch main >/dev/null 2>&1 \
            && echo "Progetto Pages creato" || echo "Progetto Pages già presente"
          if npx --yes wrangler@4 r2 bucket list 2>/dev/null | grep -q "$BUCKET"; then
            echo "Bucket R2 $BUCKET presente: download serviti da R2"
          else
            # R2 non attivo o bucket mancante: il sito inoltra i file delle release di GitHub
            echo "::warning::Bucket R2 $BUCKET non trovato: i download passano dalla release su GitHub (vedi docs/CLOUDFLARE.md)."
            sed -i '/^\[\[r2_buckets\]\]/,$d' wrangler.toml
          fi

      - name: Pubblicazione su Cloudflare Pages
        if: steps.cf.outputs.ok == 'true'
        working-directory: web
        run: npx --yes wrangler@4 pages deploy --project-name screenlove --branch main --commit-dirty=true

      - name: Controllo del sito
        if: steps.cf.outputs.ok == 'true'
        run: |
          sleep 10
          curl -fsS https://screenlove.pages.dev/latest.json | head -c 300; echo
          curl -fsSI https://screenlove.pages.dev/download/latest | grep -i '^location'
