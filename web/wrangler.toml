# Sito di ScreenLove su Cloudflare Pages (https://screenlove.it, anche screenlove.pages.dev).
# Pubblicato dal workflow .github/workflows/site.yml; in locale:  npx wrangler pages dev
name = "screenlove"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

# Pagina riservata /statistiche: Cloudflare Access (vedi docs/CLOUDFLARE.md). Vuoti = pagina chiusa.
[vars]
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""

# Statistiche anonime: download e installazioni attive (web/lib/stats.js). Database nell'Unione Europea.
[[d1_databases]]
binding = "STATS"
database_name = "screenlove-stats"
database_id = "2b567977-bfec-4dfe-bd54-60f28e39f4c5"

# File da scaricare (installer e zip). Senza il bucket il sito inoltra i file della release su GitHub.
# Deve restare l'ultima sezione: il workflow la toglie se il bucket non è disponibile.
[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "screenlove-downloads"
