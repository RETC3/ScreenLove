<style>
  @font-face { font-family: "Fraunces"; font-style: normal; font-weight: 400 700; font-display: swap; src: url(/fonts/fraunces.woff2) format("woff2"); }
  @font-face { font-family: "Fraunces"; font-style: italic; font-weight: 400 700; font-display: swap; src: url(/fonts/fraunces-italic.woff2) format("woff2"); }
  @font-face { font-family: "DM Sans"; font-style: normal; font-weight: 400 700; font-display: swap; src: url(/fonts/dm-sans.woff2) format("woff2"); }
  :root { --bg: #141518; --panel: #1E1F24; --line: #33363E; --fg: #ECECEF; --muted: #9A9CA5; --accent: #FF3D7F; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; color: var(--fg); font: 17px/1.6 "DM Sans", "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column;

  a { color: inherit; }
  .top { padding: 22px 28px; }
  .brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; font: 600 22px/1 "Fraunces", Georgia, serif; }
  .brand .logo { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
  .brand .logo svg { width: 21px; height: 21px; }
  main { flex: 1; display: grid; place-items: center; text-align: center; padding: 20px 20px 70px; }

  /* un'area di cattura vuota: la pagina non c'è */
  .shot { position: relative; display: inline-block; padding: 18px 46px 8px; margin-bottom: 34px; border: 2px dashed var(--accent); border-radius: 6px; background: rgba(255,61,127,.05); }
  .shot b { display: block; font: 500 clamp(84px, 20vw, 150px)/1 "Fraunces", Georgia, serif; letter-spacing: -.03em; }
  .shot i.h { position: absolute; width: 12px; height: 12px; background: var(--bg); border: 2px solid var(--accent); border-radius: 2px; }
  .shot i.h:nth-child(2) { left: -7px; top: -7px; } .shot i.h:nth-child(3) { right: -7px; top: -7px; }
  .shot i.h:nth-child(4) { left: -7px; bottom: -7px; } .shot i.h:nth-child(5) { right: -7px; bottom: -7px; }
  .shot .size { position: absolute; left: 50%; bottom: -36px; transform: translateX(-50%); padding: 3px 10px; border-radius: 6px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }

  h1 { font: 500 clamp(30px, 5vw, 44px)/1.15 "Fraunces", Georgia, serif; letter-spacing: -.01em; margin: 26px 0 12px; }
  h1 em { color: var(--accent); }
  p { color: var(--muted); margin: 0 auto 30px; max-width: 30em; }
  .cta { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
  .btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 26px; border-radius: 999px; font-weight: 600; font-size: 16px; text-decoration: none; border: 1px solid transparent; transition: transform .15s, background .15s, border-color .15s; }
  .btn:hover { transform: translateY(-1px); }
  .btn.primary { background: var(--accent); color: #fff; box-shadow: 0 10px 30px rgba(255,61,127,.3); }
  .btn.primary:hover { background: #ff5590; }
  .btn.outline { border-color: var(--line); background: rgba(255,255,255,.02); }
  .btn.outline:hover { border-color: var(--muted); }
  footer { padding: 18px 28px 26px; color: var(--muted); font-size: 14.5px; text-align: center; }
</style>
